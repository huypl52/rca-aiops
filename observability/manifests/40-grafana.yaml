# observability/manifests/40-grafana.yaml — Grafana + Grafana Alerting (the grafana_alerting_loki trigger source).
#
# TRIGGER SOURCE (Story 7.2 LOCK §3 / AC2): grafana_alerting_loki. Grafana Alerting
# evaluates LogQL alert rules over Loki (the demo services' logs collected by Alloy) and
# forwards firing alerts to the existing Story-1.1 ingest endpoint via a contact-point
# webhook. INFRA/config calling the already-built ingest endpoint — NOT a change to the
# agent's ingest code (1.1 endpoints unchanged). The Grafana alert payload normalizes via
# normalize_grafana -> valid IncidentTrigger (source=grafana_alerting_loki, signal=LOG).
#
# Provisioning (datasources + alerting contact point + LogQL rules) is file-based under
# /etc/grafana/provisioning. The webhook targets the RCA backend (deployed Story 7.3);
# until then the contact point is wired-but-no-sink. Versions deferred to environment.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
  alerting_contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: rca-ingest
        receivers:
          - uid: rca-ingest-webhook
            type: webhook
            settings:
              # Story-1.1 ingest endpoint (source=grafana_alerting_loki). RCA backend = Story 7.3.
              url: http://rca-backend.rca.svc.cluster.local:8000/api/alerts/grafana
              httpMethod: POST
  alerting_notificationpolicies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: rca-ingest
        group_by: [grafana_folder, alertname]
        routes:
          - receiver: rca-ingest
  # LogQL alert rules — alertname == §3.7 canonical so normalize_grafana derives it directly.
  alerting_rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: rca-demo-log-alerts
        interval: 30s
        rules:
          - uid: dns-failure-log-spike
            title: DNSFailureLogSpike
            condition: A
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: loki
                model:
                  expr: 'sum by (service) (count_over_time({namespace="demo"} |= "dns" |= "failure" [5m])) > 5'
                  instant: true
                  refId: A
            noDataState: NoData
            execErrState: Error
            for: 1m
            annotations: { summary: "DNS failure log spike", description: "log pattern dns+failure elevated" }
            labels: { severity: warning, scenario: dns_failure }
          - uid: certificate-error-detected
            title: CertificateErrorDetected
            condition: A
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: loki
                model:
                  expr: 'sum by (service) (count_over_time({namespace="demo"} |= "certificate" |= "expired" [5m])) > 0'
                  instant: true
                  refId: A
            for: 1m
            annotations: { summary: "certificate error detected", description: "log pattern certificate+expired" }
            labels: { severity: critical, scenario: certificate_expired }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels: { app.kubernetes.io/name: grafana }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: grafana } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports: [{ containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 10, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          volumeMounts:
            - { name: provisioning, mountPath: /etc/grafana/provisioning, readOnly: true }
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
            items:
              - key: datasources.yaml
                path: datasources/datasources.yaml
              - key: alerting_contactpoints.yaml
                path: alerting/contactpoints.yaml
              - key: alerting_notificationpolicies.yaml
                path: alerting/notificationpolicies.yaml
              - key: alerting_rules.yaml
                path: alerting/rules.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  selector: { app.kubernetes.io/name: grafana }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]

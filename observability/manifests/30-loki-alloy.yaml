# observability/manifests/30-loki-alloy.yaml — Loki (log store) + Grafana Alloy (collector).
#
# READ TARGET (Story 7.2): Loki stores the demo services' structured JSON logs (the 7.1
# factory.log_event -> stdout). Grafana Alloy discovers demo pods (namespace `demo`),
# tails their stdout, and ships to Loki. The agent's read-only adapters query Loki at
# runtime (LogQL) — read-only by construction; real-transport wiring deferred to 5-A1
# (AC3). Grafana Alerting (manifest 40) writes LogQL alert rules over these logs.
# Component versions deferred to environment (Story 7.2 LOCK — DEFERRED).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
  labels: { app.kubernetes.io/name: loki }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: loki } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: loki }
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.2.1
          args: [-config.file=/etc/loki/loki.yml]
          ports: [{ containerPort: 3100 }]
          readinessProbe: { httpGet: { path: /ready, port: 3100 }, initialDelaySeconds: 10, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
          volumeMounts:
            - { name: config, mountPath: /etc/loki, readOnly: true }
            - { name: data, mountPath: /loki }
      volumes:
        - name: config
          configMap:
            name: loki-config
            items: [{ key: loki.yml, path: loki.yml }]
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  # Single-binary monolithic mode (POC; multi-tenant = prod D10 — OUT per 7.1/7.2 scope).
  loki.yml: |
    auth_enabled: false
    server: { http_listen_port: 3100 }
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index: { prefix: index_, period: 24h }
    storage_config:
      filesystem: { directory: /loki/chunks }
      tsdb_shipper: { active_index_directory: /loki/tsdb-index, cache_location: /loki/tsdb-cache }
    limits_config: { allow_structured_metadata: true }
    query_scheduler:
      max_outstanding_requests_per_tenant: 4096
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
spec:
  selector: { app.kubernetes.io/name: loki }
  ports: [{ name: http, port: 3100, targetPort: 3100 }]
---
# Grafana Alloy: discovers demo pods, tails stdout (the 7.1 JSON logs), ships to Loki.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: observability
data:
  config.alloy: |
    logging { level = "info" }
    discovery.kubernetes "demo_pods" {
      role = "pod"
      namespaces {
        names = ["demo"]
      }
    }
    discovery.relabel "demo_logs" {
      targets = discovery.kubernetes.demo_pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_demo_rca_service"]
        target_label  = "service"
      }
    }
    loki.source.kubernetes "demo" {
      targets    = discovery.relabel.demo_logs.output
      forward_to = [loki.write.default.receiver]
    }
    loki.write "default" {
      endpoint { url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push" }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: observability
  labels: { app.kubernetes.io/name: alloy }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: alloy } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alloy }
    spec:
      serviceAccountName: observability-stack
      containers:
        - name: alloy
          image: grafana/alloy:v1.8.0
          args: [run, /etc/alloy/config.alloy]
          ports: [{ containerPort: 12345 }]
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 250m, memory: 256Mi } }
          volumeMounts:
            - { name: config, mountPath: /etc/alloy, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: alloy-config
            items: [{ key: config.alloy, path: config.alloy }]

[project]
name = "rca-aiops"
version = "0.1.0"
description = "RCA AI Agent POC — read-only investigator (LangGraph Plan-Execute-Reflect) + 5-microservice demo + 11-scenario benchmark."
readme = "README.md"
requires-python = ">=3.12,<4"
license = { text = "Proprietary" }
authors = [{ name = "26-rca-aiops" }]

# D2 — version pin (PyPI stable, locked 2026-06-23). uv.lock freezes exact versions.
dependencies = [
    "langgraph==1.2.6",
    "langgraph-checkpoint-sqlite==3.1.0",
    "fastapi==0.138.0",
    "uvicorn==0.49.0",
    "httpx==0.28.1",  # 7.1: declared (was transitive) — the demo microservices' create_app makes live inter-service calls via httpx.
    "pydantic==2.13.4",
    "pyyaml==6.0.3",  # 4-A1: declared (was transitive) — the reflector composition root loads config/floor_registry.yaml.
    "qdrant-client==1.18.0",
]

[dependency-groups]
# D1 — tooling (web-verified 2026-06-23): Ruff (lint+format), uv (runner), mypy (type), pytest, import-linter (gate #2).
dev = [
    "ruff>=0.11",
    "mypy>=1.13",
    "pytest>=8.3",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout — packages live at repo root.
packages = [
    "routers",
    "services",
    "graph",
    "adapters",
    "tools",
    "models",
    "eval",
    "config",
    "ci",
]

# ---------------------------------------------------------------------------
# Ruff (lint + format) — replaces Black + isort + Flake8.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["_bmad", "_bmad-output", "docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]  # line-length enforced by formatter

[tool.ruff.lint.isort]
# `demo` (Story 7.1, the standalone SUT) and `observability` (Story 7.2, the read-target
# observation layer) are first-party packages in this workspace (NOT agent layers — neither
# ships in an agent contract/wheel).
known-first-party = ["routers", "services", "graph", "adapters", "tools", "models", "eval", "config", "ci", "demo", "observability"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy (type-check) — ecosystem-aligned (FastAPI/Pydantic/LangChain CI).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
# Scaffold has no business code yet; allow untyped/empty modules without noise.
# Each story that adds code tightens as needed.
exclude = "^(_bmad|_bmad-output|docs|\\.venv)/"

[[tool.mypy.overrides]]
# Third-party stubs not shipped — relax missing-stubs noise for the runtime deps.
module = [
    "langgraph.*",
    "langgraph_checkpoint_sqlite.*",
    "qdrant_client.*",
    "uvicorn.*",
    "yaml.*",  # 4-A1/4-3: pyyaml 6.0.3 ships no findable stubs under strict mypy (the composition-root yaml load).
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# ---------------------------------------------------------------------------
# import-linter (CI gate #2 — dependency-direction HARD-FAIL, AD-13 #2 / AD-1)
# ---------------------------------------------------------------------------
[tool.importlinter]
# `demo` (Story 7.1) and `observability` (Story 7.2) are root packages so import-linter can
# discover + contract-check them (neither is installed into the venv — not a hatch wheel
# package — so each must be listed here to be analyzed). The layers contract below is
# UNCHANGED and names neither; the `forbidden` contracts enforce each→agent boundary.
root_packages = ["routers", "services", "graph", "adapters", "tools", "demo", "observability"]
# include_external_packages — the `forbidden` contract lists agent packages (models/eval/
# ci/config) that are NOT root_packages; import-linter treats them as "external" and would
# otherwise be BLIND to a `demo → models` import (the boundary would be hollow). This flag
# pulls external packages into the import graph so the forbidden contract can actually
# catch a demo→agent coupling. The `layers` contract is unaffected (it only constrains the
# direction BETWEEN the 5 named layers; imports to non-layer packages stay unconstrained).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "One-way layered architecture (AD-1 / AD-2)"
type = "layers"
layers = [
    "routers",
    "services",
    "graph",
    "adapters",
    "tools",
]
# layers contract: each layer may only import layers at the same or later index.
# routers(0) → services/graph/adapters/tools ; tools(4) → nothing.
# This forbids back-edges: adapters↛graph, adapters↛services, tools↛graph, tools↛services, graph↛routers.
# Circular imports = fail. Enforced HARD-FAIL in CI.

[[tool.importlinter.contracts]]
# Story 7.1 — DEMO-vs-AGENT BOUNDARY (the headline constraint of this story).
# `demo` is the standalone SYSTEM-UNDER-INVESTIGATION (the 5 microservices the RCA agent
# investigates at runtime); it must NOT import/couple to any RCA-agent module. The linear
# `layers` contract above can't express "demo is independent of all agent layers", so a
# separate `forbidden` contract enforces it: no `demo` module may import any agent module.
# Proven HARD-FAIL by the negative self-test tests/ci/test_gate2_demo_boundary.py (mirrors
# test_gate2_deps.py). The agent never imports demo either (no reverse contract needed).
name = "Demo never imports RCA-agent code (Story 7.1 boundary)"
type = "forbidden"
source_modules = ["demo"]
forbidden_modules = ["routers", "services", "graph", "adapters", "tools", "models", "eval", "ci", "config"]

[[tool.importlinter.contracts]]
# Story 7.2 — OBSERVABILITY-vs-AGENT BOUNDARY (parallel to the 7.1 demo contract, which is
# left untouched). `observability` is the READ-TARGET observation layer (the stack the agent
# reads evidence FROM at runtime via its read-only adapters); like `demo` it must NOT
# import/couple to any RCA-agent module. The linear `layers` contract can't express
# "observability is independent of all agent layers", so a separate `forbidden` contract
# enforces it: no `observability` module may import any agent module. Proven HARD-FAIL by
# the negative self-test tests/ci/test_gate2_observability_boundary.py (mirrors the 7.1 test).
name = "Observability never imports RCA-agent code (Story 7.2 boundary)"
type = "forbidden"
source_modules = ["observability"]
forbidden_modules = ["routers", "services", "graph", "adapters", "tools", "models", "eval", "ci", "config"]

# demo/k8s/30-deployments.yaml — the 5 demo microservice Deployments (Story 7.1).
#
# All 5 use the SAME image (demo/app:latest, built once from demo/Dockerfile); the
# service is selected per-Deployment via DEMO_MODULE (the uvicorn target module)
# and DEMO_PORT. imagePullPolicy: Never — the image is `kind load`-ed locally, not
# pulled from a registry.
#
# POD LABEL NOTE (forward-compat for Story 7.3 chaos/k8s-adapter queries): the
# `app` label uses the spec §3.7 label_selector forms (eval/scenarios.py queries
# `app=order-service`, `app=payment-service`, …) — so a 7.3 fault can target pods
# by the same selector the benchmark injects. The `demo.rca/service` label carries
# the short name (matches the Service selector + topology).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: demo
  labels: { demo.rca/service: api-gateway }
spec:
  replicas: 1
  selector: { matchLabels: { demo.rca/service: api-gateway } }
  template:
    metadata:
      labels:
        app: api-gateway
        demo.rca/service: api-gateway
    spec:
      containers:
        - name: app
          image: demo/app:latest
          imagePullPolicy: Never
          envFrom: [{ configMapRef: { name: demo-config } }]
          env:
            - { name: DEMO_MODULE, value: api_gateway }
            - { name: DEMO_PORT, value: "8080" }
            - { name: PYTHONHASHSEED, value: "42" }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 256Mi } }

# demo/k8s/20-services.yaml — 5 ClusterIP Services (Story 7.1).
# Service/DNS names = the LOCKED short names (api-gateway/user/order/inventory/
# payment) so inter-service calls http://<service> resolve. Each Service exposes
# port 80 → the service's containerPort (8080..8084). Pod selection is by the
# `demo.rca/service` label (NOT `app` — see 30-deployments.yaml for the §3.7
# `app` label note).
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: demo
spec:
  selector: { demo.rca/service: api-gateway }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: demo
spec:
  selector: { demo.rca/service: user }
  ports: [{ name: http, port: 80, targetPort: 8081 }]
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: demo
spec:
  selector: { demo.rca/service: order }
  ports: [{ name: http, port: 80, targetPort: 8082 }]
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: demo
spec:
  selector: { demo.rca/service: inventory }
  ports: [{ name: http, port: 80, targetPort: 8083 }]
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: demo
spec:
  selector: { demo.rca/service: payment }
  ports: [{ name: http, port: 80, targetPort: 8084 }]

name: ci

# CI invariants (AD-13). Story 0.1 wires gates #1 + #2 (HARD-FAIL, no opt-out).
# Gates #3-#6 are placeholders filled by later epics (see ci/GATES.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: lint + type + test + gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (reproducible, from uv.lock)
        run: uv sync --frozen --group dev

      # ---- Lint (Ruff) — HARD-FAIL ----
      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      # ---- Type-check (mypy) — HARD-FAIL ----
      - name: mypy
        run: uv run mypy .

      # ---- Tests (pytest) — HARD-FAIL ----
      - name: pytest
        run: uv run pytest

      # =====================================================================
      # CI INVARIANT GATES (AD-13)
      # =====================================================================

      # Gate #1 — read-only registry (AD-13 #1 / AD-3 BLOCKER). HARD-FAIL, no opt-out.
      - name: "Gate #1: read-only registry (HARD-FAIL)"
        run: uv run python ci/gate1_readonly_registry.py --root .

      # Gate #2 — dependency-direction (AD-13 #2 / AD-1 / AD-2). HARD-FAIL, no opt-out.
      - name: "Gate #2: dependency-direction import-linter (HARD-FAIL)"
        run: uv run lint-imports

      # Gate #3 — type-coherence 2-tier round-trip (AD-13 #3 / AD-9). HARD-FAIL, no opt-out.
      # Story 0.3: asserts InvestigationState (graph TypedDict) shape ⊆ Pydantic port contract
      # (ci.contract_schema — spec-derived, NOT the TypedDict) + LangGraph built-in
      # serialize→deserialize round-trip deep-equal + JSON-safe invariant (json.dumps).
      - name: "Gate #3: type-coherence round-trip (HARD-FAIL)"
        run: uv run pytest tests/ci/test_gate3_type_coherence.py -v

      # Gate #4 — floor determinism (AD-13 #4 / AD-12). HARD-FAIL, no opt-out.
      # Story 4.1: asserts floor_check is a PURE function (same input -> same FloorResult) AND is
      # PYTHONHASHSEED-safe cross-process (seeds {0,1,7,42,99} -> identical serialized verdict) AND the
      # declarative registry schema-validates-at-load (every malformed floor spec -> FloorSchemaError).
      # PROMOTED 2026-06-24 at the Epic-6 retrospective (leader-driven): this was a `echo "TODO(Epic 4)"`
      # PLACEHOLDER since Epic 4 — 7 stories stale (Epic 4 x1 + Epic 5 x2 + Epic 6 x4). The test
      # tests/ci/test_gate4_floor_determinism.py existed + was green (40 passed) the whole time, but
      # ci.yml was a no-op echo — so the "WIRED" claim in ci/GATES.md was a green-lie. Closed here.
      - name: "Gate #4: floor determinism (HARD-FAIL)"
        run: uv run pytest tests/ci/test_gate4_floor_determinism.py -v

      # Gate #5 — contract schema preservation 18/9-field (AD-13 #5 / AD-6). HARD-FAIL, no opt-out.
      # Story 0.2: asserts IncidentTrigger == 18 §3.4 fields + Evidence == 9 §3.6 fields, no drift.
      # Source-of-truth field-set = ci/contract_schema.py (spec-derived, NOT the models).
      # Negative test (tests/ci/test_gate5_contract_schema.py) proves drift → FAIL.
      - name: "Gate #5: contract schema 18/9-field (HARD-FAIL)"
        run: uv run pytest tests/ci/test_gate5_contract_schema.py -v

      # Gate #6 — benchmark DETERMINISM axis (AD-13 #6 / FR-10 / NFR-Determinism). HARD-FAIL.
      # Story 6.1 makes ONLY the determinism axis real: the 11-scenario canned inject → REAL adapter
      # → REAL evidence_normalizer produces a byte-identical Evidence symptom across PYTHONHASHSEED
      # values (decisive cross-process proof — the test spawns `python -m tests.eval_harness` under
      # several seeds). The negative test proves the assertion has teeth (a deliberately hash-seed-
      # dependent blob is caught). SCORING axes are honestly DEFERRED (the 4-A3 pattern — never a
      # silent green lie): binary conjunction §3.7 DETERMINISM → Story 6.2 (DONE — the full-agent
      # conjunction blob, driving the compiled graph over all 11, is byte-stable across PYTHONHASHSEED);
      # partial-credit/tolerance window ON the conjunction + anti-hallucination raw-vs-summary (SM-3)
      # → Story 6.3 (DONE — the graded scoring blob, computed ABOVE the conjunction over all 11, is
      # byte-stable across PYTHONHASHSEED; §2D); playbook-retrieval independent axis (SM-4 / FR-10e /
      # A6) + train/eval split (Q8 / FR-10) → Story 6.4 (DONE — the retrieval blob, two INDEPENDENT
      # columns ABOVE the 6.1/6.2/6.3 baselines — SM-4 = the playbook-retrieval independent axis reading
      # the REAL playbook_hits + Q8 = the deterministic leak-free train/eval partition — is byte-stable
      # across PYTHONHASHSEED; §2C). A green gate #6 here means "the inject→symptom AND the full-agent
      # conjunction AND the graded scoring AND the SM-4 retrieval + Q8 split axes RUN + are
      # DETERMINISTIC", NOT "the agent passes the benchmark scoring" — the honest baselines are
      # SM-1 = 0% (the graph does not converge, 5-A1; fixing that is a SEPARATE story) + SM-2 blocked
      # (no reports) + graded coverage {a≈1.0, b=1.0, c=0, d=0, e=0} + SM-3 evidence-layer 100% /
      # report-layer blocked + SM-4 EMPTY/DEGRADED (playbook_hits=[] 11/11 — no Qdrant corpus, 5-A1-
      # family; R1: do NOT add retrieval content) + Q8 leak-free/calibration-moot (no reports — 5-A1);
      # the scoring PASS + any confidence/SM cutoff + the retrieval PASS + the Q8 split ratio (D4) are
      # NOT asserted here.
      - name: "Gate #6: benchmark determinism axis (HARD-FAIL)"
        run: |
          uv run pytest tests/ci/test_gate6_benchmark_determinism.py -v
          uv run pytest tests/ci/test_gate6_conjunction_determinism.py -v
          uv run pytest tests/ci/test_gate6_scoring_determinism.py -v
          uv run pytest tests/ci/test_gate6_retrieval_determinism.py -v

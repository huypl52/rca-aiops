# deploy/k8s/00-rca-backend.yaml — the RCA backend (the agent) deployed as a Service.
#
# AC2 (Story 7.3): deploy the RCA backend (FastAPI routers/ + LangGraph graph/) as Service
# `rca-backend` (port 8000) — the URL the 7.2 trigger sources target
# (http://rca-backend.rca.svc.cluster.local:8000 — grafana contact point, prometheus scrape
# target, event-watcher default ingest URL).
#
# NAMESPACE = rca (reconciliation, recorded in the Story 7.3 CS): the dispatch named
# "namespace demo", but every 7.2 trigger-source URL resolves `rca-backend` in `rca`
# (rca-backend.rca.svc.cluster.local). Deploying in `rca` keeps the existing wiring consistent;
# deploying in `demo` would have left those URLs dangling. The agent is a service separate from
# the demo SUT (ns demo) and the observability stack (ns observability), so a dedicated `rca`
# namespace is architecturally clean too.
#
# RBAC (CS Q3): NONE now. The deployed backend's default dispatcher (ContextBuilderRunner) +
# canned transport (FakeReadOnlyTransport / StubReadOnlyAdapter) make NO cluster API calls — it
# reads nothing from K8s. The ServiceAccount therefore carries NO ClusterRole (least privilege).
# Read-only get/list/watch RBAC (mirroring the 7.2 observability ClusterRole) lands with the
# 5-A1 real-transport — NOT granted speculatively here.
#
# PRODUCTION HARDENING (Phase 3, 2026-07-01):
# - Secrets: LLM API key moved to a K8s Secret (rca-backend-secrets). No plaintext keys in manifest.
# - LLM endpoint: uses env var RCA_HYPOTHESIS_LLM_API_URL with no hardcoded IP; operators set it
#   via the Secret or an additional ConfigMap/overlay. The WSL2 gateway IP is a dev-only default.
# - Checkpoint storage: PVC (rca-checkpoint-pvc) replaces /tmp ephemeral path. The checkpoint DB
#   survives pod restarts. Operators must provision storage class or adjust the PVC spec.
# - Security context: non-root user, readOnlyRootFilesystem, dropped capabilities.
# - HTTP health endpoint: readiness/liveness probes now hit GET /health instead of TCP-only.
# - PodDisruptionBudget: ensures availability during voluntary disruptions.
---
apiVersion: v1
kind: Namespace
metadata:
  name: rca
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rca-backend
  namespace: rca
---
# PVC for durable checkpoint storage — replaces ephemeral /tmp path.
# The checkpoint DB persists across pod restarts, enabling cross-restart investigation resume.
# Adjust storageClassName and size for your environment.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rca-checkpoint-pvc
  namespace: rca
  labels: { app.kubernetes.io/name: rca-backend }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  # storageClassName: standard  # uncomment and set for non-default storage classes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-backend
  namespace: rca
  labels: { app.kubernetes.io/name: rca-backend }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: rca-backend } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rca-backend }
    spec:
      serviceAccountName: rca-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rca-backend
          image: rca-backend:7.3
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          env:
            - { name: RCA_CHECKPOINT_DB, value: "/data/rca-checkpoint.db" }
            - { name: RCA_HYPOTHESIS_LLM_ENABLED, value: "true" }
            - { name: RCA_HYPOTHESIS_LLM_PROVIDER, value: "openai" }
            - { name: RCA_HYPOTHESIS_LLM_MODEL, value: "gpt-5.4-mini" }
            # Sensitive values from Secret
            - name: RCA_HYPOTHESIS_LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: rca-backend-secrets, key: RCA_HYPOTHESIS_LLM_API_KEY }
            - name: RCA_HYPOTHESIS_LLM_API_URL
              valueFrom:
                secretKeyRef: { name: rca-backend-secrets, key: RCA_HYPOTHESIS_LLM_API_URL }
          ports:
            - containerPort: 8000
              name: http
          # HTTP health probe — the app exposes GET /health (added Phase 3)
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: checkpoint-data, mountPath: /data }
            # Writable tmp for Python __pycache__ under readOnlyRootFilesystem
            - { name: tmp-cache, mountPath: /tmp }
      volumes:
        - name: checkpoint-data
          persistentVolumeClaim:
            claimName: rca-checkpoint-pvc
        - name: tmp-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rca-backend
  namespace: rca
spec:
  selector: { app.kubernetes.io/name: rca-backend }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
# PodDisruptionBudget — maintains availability during voluntary disruptions (drains, upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rca-backend-pdb
  namespace: rca
  labels: { app.kubernetes.io/name: rca-backend }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: rca-backend }
